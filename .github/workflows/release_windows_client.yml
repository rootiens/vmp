name: Release Windows client

on:
  push:
    branches:
      - ci/release-windows-client
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: release-windows-client
  cancel-in-progress: true

jobs:
  build_and_release:
    name: Build FiveM Windows + Release
    # windows-2022 keeps VS2022 + .NET 4.6 targeting pack; windows-latest may be VS18-only.
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PROGRAM: five
      RELEASE_TAG: vmp-win-${{ github.run_number }}
    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="C:/b"
          ROOT_REPO="$ROOT/five"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=$(nproc --all)

          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"

          mkdir -p "$ROOT_REPO" "$ROOT_DEP"
          echo "Building ${{ github.sha }} as tag $RELEASE_TAG"

      - name: Checkout branch + public submodules
        shell: bash
        env:
          VMP_GIT_TOKEN: ${{ secrets.VMP_GIT_TOKEN }}
          VMP_GIT_USERNAME: ${{ secrets.VMP_GIT_USERNAME }}
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"

          export GIT_TERMINAL_PROMPT=0
          export GCM_INTERACTIVE=never
          git config --global --add safe.directory '*'

          git init .
          git config core.symlinks true
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

          # Default CI path: NO git.vmp.ir token.
          # Rewrite submodule URLs to the public citizenfx/FiveM mirrors (same paths),
          # while keeping this branch's pinned submodule SHAs.
          if [[ -n "${VMP_GIT_TOKEN:-}" ]]; then
            echo "VMP_GIT_TOKEN present → using private git.vmp.ir"
            GIT_USER="${VMP_GIT_USERNAME:-oauth2}"
            git config --global credential.helper store
            git config --global url."https://${GIT_USER}:${VMP_GIT_TOKEN}@git.vmp.ir/".insteadOf "https://git.vmp.ir/"
            git config --global url."https://${GIT_USER}:${VMP_GIT_TOKEN}@git.vmp.ir/".insteadOf "http://git.vmp.ir/"
          else
            echo "No VMP_GIT_TOKEN → rewriting .gitmodules to public citizenfx/GitHub URLs"
            python3 .github/workflows/ci/rewrite_submodules_public.py
          fi

          # Do not use --depth=1: pinned SHAs are often not the tip of the default branch.
          status=1
          for attempt in 1 2 3; do
            echo "Submodule update attempt $attempt"
            if git submodule sync --recursive \
              && git submodule update --jobs="$JOB_SLOTS" --init --recursive; then
              status=0
              break
            fi
            echo "Submodule update failed; retrying..."
            sleep 8
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Failed to clone submodules from public mirrors. A pinned SHA may exist only on git.vmp.ir; in that case add optional secret VMP_GIT_TOKEN."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Yarn + Python deps
        shell: bash
        run: |
          npm install -g yarn
          # mojo/udis86 hardcode `py -3` — install into THAT interpreter, not plain `python`.
          py -3 -m pip install --upgrade pip setuptools wheel six jinja2 markupsafe ply
          py -3 -c "import six,jinja2,markupsafe,ply; print('py -3 ok', __import__('sys').version)"

      - name: Compute cache keys
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"
          CEF_KEY="none"
          if [[ -f vendor/cef/cef_build_name.txt ]]; then
            CEF_KEY=$(tr -d '[:space:]' < vendor/cef/cef_build_name.txt)
          fi
          YARN_KEY=$(cat ext/native-doc-tooling/yarn.lock 2>/dev/null | sha256sum | awk '{print $1}')
          echo "CACHE_CEF_KEY=$CEF_KEY" >> "$GITHUB_ENV"
          echo "CACHE_YARN_KEY=${YARN_KEY:-none}" >> "$GITHUB_ENV"

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: ${{ env.ROOT_REPO }}/code/build
          key: cef-${{ env.CACHE_CEF_KEY }}
          restore-keys: |
            cef-

      - name: Cache yarn (native-doc-tooling)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ROOT_REPO }}/ext/native-doc-tooling/node_modules
            ~/AppData/Local/Yarn/Cache
          key: yarn-ndt-${{ env.CACHE_YARN_KEY }}
          restore-keys: |
            yarn-ndt-

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-v1
          restore-keys: |
            nuget-win-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Use the runner's preinstalled C:\msys64 — skips ~9min fresh install.
          release: false
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-headers-git
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-python
            make
            tar
            diffutils

      - name: Preflight (seconds, no compile)
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"
          chmod +x .github/workflows/ci/preflight_windows.sh
          .github/workflows/ci/preflight_windows.sh

      - name: Compile Windows client
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"
          export PROGRAM=five
          # prebuild_natives.cmd expects pacman/make from C:\msys64, but keep
          # setup-python/node ahead of MinGW so node-gyp does not pick MinGW python.
          export PATH="$PATH:/c/msys64/usr/bin:/c/msys64/mingw64/bin"
          chmod +x .github/workflows/ci/build_windows.sh
          .github/workflows/ci/build_windows.sh "$ROOT_DEP" "$JOB_SLOTS"

      - name: Stage release package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"

          OUT_DIR="$ROOT_REPO/artifacts/vmp-windows-client"
          ZIP_PATH="$ROOT_REPO/artifacts/vmp-windows-client-$RELEASE_TAG.zip"
          rm -rf "$OUT_DIR" "$ROOT_REPO/artifacts"/*.zip
          mkdir -p "$OUT_DIR"

          if [[ -d code/bin/five/release ]]; then
            cp -a code/bin/five/release/. "$OUT_DIR/"
          elif [[ -d code/bin/five/Release ]]; then
            cp -a code/bin/five/Release/. "$OUT_DIR/"
          else
            echo "::error::Release output folder not found under code/bin/five/"
            find code/bin -maxdepth 4 -type d -print || true
            exit 1
          fi

          {
            echo "repo=${{ github.repository }}"
            echo "branch=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "tag=$RELEASE_TAG"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=Developer Windows client binaries from CI. Not the full website installer. Use for testing crash-logging builds on top of an existing VMP install."
          } > "$OUT_DIR/BUILD_INFO.txt"

          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$OUT_DIR\\*' -DestinationPath '$ZIP_PATH' -Force"

          ls -lah "$ZIP_PATH"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmp-windows-client-${{ env.RELEASE_TAG }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Windows client ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            Automatic Windows client build from `ci/release-windows-client`.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Tag: `${{ env.RELEASE_TAG }}`

            Zip = developer `code/bin/five/release` layout (not the full VMP website installer).
          files: ${{ env.ARTIFACT_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
