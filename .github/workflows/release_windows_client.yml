name: Release Windows client

on:
  push:
    branches:
      - ci/release-windows-client
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: release-windows-client
  cancel-in-progress: true

jobs:
  build_and_release:
    name: Build FiveM Windows + Release
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PROGRAM: five
      RELEASE_TAG: vmp-win-${{ github.run_number }}
    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="C:/b"
          ROOT_REPO="$ROOT/five"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=$(nproc --all)

          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"

          mkdir -p "$ROOT_REPO" "$ROOT_DEP"
          echo "Building ${{ github.sha }} as tag $RELEASE_TAG"

      - name: Checkout branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"
          git init .
          git config core.symlinks true
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD
          git submodule update --jobs="$JOB_SLOTS" --init --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Yarn + Python setuptools
        shell: bash
        run: |
          npm install -g yarn
          python -m pip install --upgrade pip setuptools

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-headers-git
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-python
            make
            tar

      - name: Compile Windows client
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"
          export PROGRAM=five
          chmod +x .github/workflows/ci/build_windows.sh
          .github/workflows/ci/build_windows.sh "$ROOT_DEP" "$JOB_SLOTS"

      - name: Stage release package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"

          OUT_DIR="$ROOT_REPO/artifacts/vmp-windows-client"
          ZIP_PATH="$ROOT_REPO/artifacts/vmp-windows-client-$RELEASE_TAG.zip"
          rm -rf "$OUT_DIR" "$ROOT_REPO/artifacts"/*.zip
          mkdir -p "$OUT_DIR"

          if [[ -d code/bin/five/release ]]; then
            cp -a code/bin/five/release/. "$OUT_DIR/"
          elif [[ -d code/bin/five/Release ]]; then
            cp -a code/bin/five/Release/. "$OUT_DIR/"
          else
            echo "::error::Release output folder not found under code/bin/five/"
            find code/bin -maxdepth 4 -type d -print || true
            exit 1
          fi

          {
            echo "repo=${{ github.repository }}"
            echo "branch=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "tag=$RELEASE_TAG"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=Developer Windows client binaries from CI. Not the full website installer. Use for testing crash-logging builds on top of an existing VMP install."
          } > "$OUT_DIR/BUILD_INFO.txt"

          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$OUT_DIR\\*' -DestinationPath '$ZIP_PATH' -Force"

          ls -lah "$ZIP_PATH"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmp-windows-client-${{ env.RELEASE_TAG }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Windows client ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            Automatic Windows client build from `ci/release-windows-client`.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Tag: `${{ env.RELEASE_TAG }}`

            Zip = developer `code/bin/five/release` layout (not the full VMP website installer).
          files: ${{ env.ARTIFACT_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
