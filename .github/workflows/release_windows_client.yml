name: Release Windows client

on:
  push:
    branches:
      - ci/release-windows-client
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: release-windows-client
  cancel-in-progress: true

jobs:
  build_and_release:
    name: Build FiveM Windows + Release
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PROGRAM: five
      RELEASE_TAG: vmp-win-${{ github.run_number }}
    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="C:/b"
          ROOT_REPO="$ROOT/five"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=$(nproc --all)

          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"

          mkdir -p "$ROOT_REPO" "$ROOT_DEP"
          echo "Building ${{ github.sha }} as tag $RELEASE_TAG"

      - name: Check git.vmp.ir credentials
        shell: bash
        env:
          VMP_GIT_TOKEN: ${{ secrets.VMP_GIT_TOKEN }}
          VMP_GIT_USERNAME: ${{ secrets.VMP_GIT_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "${VMP_GIT_TOKEN:-}" ]]; then
            echo "::error::Missing secret VMP_GIT_TOKEN. All vendor submodules are on private https://git.vmp.ir and CI cannot clone them without auth."
            echo "::error::Add repo secret VMP_GIT_TOKEN (GitLab PAT/deploy token with read_repository). Optional secret VMP_GIT_USERNAME (default: oauth2)."
            echo "::error::GitHub → rootiens/vmp → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "VMP_GIT_TOKEN is present"
          if [[ -n "${VMP_GIT_USERNAME:-}" ]]; then
            echo "VMP_GIT_USERNAME is present"
          else
            echo "VMP_GIT_USERNAME empty; will use oauth2"
          fi

      - name: Checkout branch + private submodules
        shell: bash
        env:
          VMP_GIT_TOKEN: ${{ secrets.VMP_GIT_TOKEN }}
          VMP_GIT_USERNAME: ${{ secrets.VMP_GIT_USERNAME }}
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"

          GIT_USER="${VMP_GIT_USERNAME:-oauth2}"

          # Avoid interactive auth prompts in Actions.
          export GIT_TERMINAL_PROMPT=0
          export GCM_INTERACTIVE=never
          git config --global --add safe.directory '*'
          git config --global credential.helper store
          git config --global url."https://${GIT_USER}:${VMP_GIT_TOKEN}@git.vmp.ir/".insteadOf "https://git.vmp.ir/"
          git config --global url."https://${GIT_USER}:${VMP_GIT_TOKEN}@git.vmp.ir/".insteadOf "http://git.vmp.ir/"

          git init .
          git config core.symlinks true
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

          # Retry submodule sync a few times; private GitLab can flake under parallel clone.
          status=1
          for attempt in 1 2 3; do
            echo "Submodule update attempt $attempt"
            if git submodule sync --recursive \
              && git submodule update --jobs="$JOB_SLOTS" --init --recursive --depth=1; then
              status=0
              break
            fi
            echo "Submodule update failed; retrying..."
            sleep 5
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Failed to clone private git.vmp.ir submodules. Check VMP_GIT_TOKEN permissions (read_repository) and that the token can access https://git.vmp.ir/vmp/*"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Yarn + Python setuptools
        shell: bash
        run: |
          npm install -g yarn
          python -m pip install --upgrade pip setuptools

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-headers-git
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-python
            make
            tar

      - name: Compile Windows client
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"
          export PROGRAM=five
          chmod +x .github/workflows/ci/build_windows.sh
          .github/workflows/ci/build_windows.sh "$ROOT_DEP" "$JOB_SLOTS"

      - name: Stage release package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_REPO"

          OUT_DIR="$ROOT_REPO/artifacts/vmp-windows-client"
          ZIP_PATH="$ROOT_REPO/artifacts/vmp-windows-client-$RELEASE_TAG.zip"
          rm -rf "$OUT_DIR" "$ROOT_REPO/artifacts"/*.zip
          mkdir -p "$OUT_DIR"

          if [[ -d code/bin/five/release ]]; then
            cp -a code/bin/five/release/. "$OUT_DIR/"
          elif [[ -d code/bin/five/Release ]]; then
            cp -a code/bin/five/Release/. "$OUT_DIR/"
          else
            echo "::error::Release output folder not found under code/bin/five/"
            find code/bin -maxdepth 4 -type d -print || true
            exit 1
          fi

          {
            echo "repo=${{ github.repository }}"
            echo "branch=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "tag=$RELEASE_TAG"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=Developer Windows client binaries from CI. Not the full website installer. Use for testing crash-logging builds on top of an existing VMP install."
          } > "$OUT_DIR/BUILD_INFO.txt"

          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$OUT_DIR\\*' -DestinationPath '$ZIP_PATH' -Force"

          ls -lah "$ZIP_PATH"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmp-windows-client-${{ env.RELEASE_TAG }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Windows client ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            Automatic Windows client build from `ci/release-windows-client`.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Tag: `${{ env.RELEASE_TAG }}`

            Zip = developer `code/bin/five/release` layout (not the full VMP website installer).
          files: ${{ env.ARTIFACT_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
